<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MC 服务器人数监控</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="/static/echarts.min.js"></script>
</head>
<body>
<header>
  <h1>MC Player Monitor <span>/ 人数监控</span></h1>

  <div class="stats">
    <div class="stat">服务器<b id="host">-</b></div>
    <div class="stat">在线<b id="online">-</b></div>
    <div class="stat">上限<b id="max">-</b></div>
    <div class="stat">状态<b id="status">-</b></div>
  </div>

  <div class="seg" id="seg">
    <button data-h="1">1 小时</button>
    <button data-h="6" class="active">6 小时</button>
    <button data-h="24">24 小时</button>
    <button data-h="168">7 天</button>
  </div>

  <button class="theme-btn" id="themeBtn" title="切换主题">
    <svg id="themeIcon" viewBox="0 0 24 24"></svg>
    <span id="themeLabel">Auto</span>
  </button>
</header>
<div id="chart"></div>
<div class="hint">滚轮缩放 · 按住拖动平移</div>

<script>
const API = "";
const chart = echarts.init(document.getElementById("chart"));

let currentHours = 6;
let zoomState = { start: 0, end: 100 };

// 前端刷新间隔（由后端 /api/records 返回的 interval 决定）
let refreshInterval = 30;
let refreshTimer = null;

// ========== 主题 ==========
let themeMode = localStorage.getItem("themeMode") || "auto";

function systemPrefersDark() {
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function effectiveTheme() {
  if (themeMode === "auto") return systemPrefersDark() ? "dark" : "light";
  return themeMode;
}
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const get = n => cs.getPropertyValue(n).trim();
  return {
    fg: get("--fg"),
    dim: get("--fg-dim"),
    faint: get("--fg-faint"),
    grid: get("--grid"),
    border: get("--border"),
    panel: get("--panel"),
    line: get("--line"),
    lineGlow: get("--line-glow"),
    areaTop: get("--area-top"),
    areaMid: get("--area-mid"),
    tooltipShadow: get("--tooltip-shadow"),
  };
}
function renderThemeIcon() {
  const svg = document.getElementById("themeIcon");
  const label = document.getElementById("themeLabel");
  if (themeMode === "auto") {
    svg.innerHTML = `<path d="M12 3a9 9 0 0 1 0 18 9 9 0 0 1 0-18z" fill="currentColor" stroke="none" opacity="0.25"/><path d="M12 3a9 9 0 0 0 0 18"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"/>`;
    label.textContent = "Auto";
  } else if (themeMode === "light") {
    svg.innerHTML = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>`;
    label.textContent = "Light";
  } else {
    svg.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
    label.textContent = "Dark";
  }
}
function applyTheme() {
  document.documentElement.setAttribute("data-theme", effectiveTheme());
  renderThemeIcon();
  renderChart(lastRaw, lastChangePts, lastMax);
}
document.getElementById("themeBtn").addEventListener("click", () => {
  themeMode = themeMode === "auto" ? "light" : themeMode === "light" ? "dark" : "auto";
  localStorage.setItem("themeMode", themeMode);
  applyTheme();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (themeMode === "auto") applyTheme();
});

// ========== 数据状态 ==========
let lastRaw = [];
let lastChangePts = [];
let lastMax = [];

chart.on("datazoom", () => {
  const dz = chart.getOption().dataZoom;
  if (dz && dz[0]) {
    zoomState = { start: dz[0].start ?? 0, end: dz[0].end ?? 100 };
  }
});

function extractChangePoints(data) {
  const pts = [];
  for (let i = 0; i < data.length; i++) {
    const cur = data[i];
    const prev = data[i - 1];
    if (!prev || cur.online !== prev.online) {
      pts.push([cur.ts * 1000, cur.online]);
    }
  }
  return pts;
}

// ========== 渲染 ==========
function renderChart(raw, changePts, maxLine) {
  const c = readColors();
  const points = raw.map(d => [d.ts * 1000, d.online]);
  const isMobile = window.innerWidth <= 640;

  chart.setOption({
    backgroundColor: "transparent",
    animation: true,
    animationDuration: 200,
    animationEasing: "linear",
    textStyle: { color: c.fg },
    grid: {
      left: isMobile ? 36 : 52,
      right: isMobile ? 16 : 32,
      top: isMobile ? 44 : 40,
      bottom: isMobile ? 24 : 40
    },
    tooltip: {
      trigger: "axis",
      confine: true,
      backgroundColor: c.panel,
      borderColor: c.border,
      borderWidth: 1,
      padding: [8, 12],
      textStyle: { color: c.fg, fontSize: 12 },
      extraCssText: `box-shadow: ${c.tooltipShadow}; border-radius: 8px;`,
      axisPointer: {
        type: "line",
        lineStyle: { color: c.faint, width: 1, type: "dashed" }
      },
      formatter: params => {
        const t = new Date(params[0].value[0]).toLocaleString();
        const v = params
          .filter(p => p.seriesName !== "变化点")
          .map(p => `${p.marker} ${p.seriesName}: <b>${p.value[1]}</b>`)
          .join("<br>");
        return `${t}<br>${v}`;
      }
    },
    legend: {
      top: isMobile ? 8 : 12,
      right: isMobile ? 12 : 24,
      data: ["在线人数", "最大人数"],
      textStyle: { color: c.dim, fontSize: isMobile ? 11 : 12 },
      itemWidth: 16, itemHeight: 8, itemGap: isMobile ? 10 : 16
    },
    xAxis: {
      type: "time",
      boundaryGap: false,
      axisLine: { lineStyle: { color: c.border } },
      axisTick: { show: false },
      axisLabel: {
        color: c.faint,
        fontSize: isMobile ? 10 : 11,
        hideOverlap: true
      },
      splitLine: { show: false }
    },
    yAxis: {
      type: "value",
      minInterval: 1,
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: { color: c.faint, fontSize: isMobile ? 10 : 11 },
      splitLine: { lineStyle: { color: c.grid, width: 1 } }
    },
    dataZoom: [
      {
        type: "inside",
        start: zoomState.start,
        end: zoomState.end,
        zoomOnMouseWheel: true,
        moveOnMouseWheel: false,
        moveOnMouseMove: true,
      }
    ],
    series: [
      {
        id: "online",
        name: "在线人数",
        type: "line",
        smooth: 0.35,
        showSymbol: false,
        lineStyle: {
          width: isMobile ? 2 : 2.5,
          color: c.line,
          shadowColor: c.lineGlow,
          shadowBlur: 10,
          shadowOffsetY: 0
        },
        itemStyle: { color: c.line },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: c.areaTop },
            { offset: 0.7, color: c.areaMid },
            { offset: 1, color: "rgba(0,0,0,0)" }
          ])
        },
        emphasis: { focus: "series" },
        data: points
      },
      {
        id: "max",
        name: "最大人数",
        type: "line",
        smooth: 0.35,
        showSymbol: false,
        lineStyle: { width: 1.5, type: "dashed", color: c.faint },
        itemStyle: { color: c.faint },
        data: maxLine
      },
      {
        id: "change",
        name: "变化点",
        type: "scatter",
        symbol: "circle",
        symbolSize: isMobile ? 6 : 7,
        itemStyle: {
          color: c.panel,
          borderColor: c.line,
          borderWidth: 2
        },
        emphasis: {
          scale: 1.4,
          itemStyle: { color: c.line, borderColor: c.panel }
        },
        z: 10,
        data: changePts
      }
    ]
  });
}

// ========== 顶部状态 ==========
function updateHeader(r) {
  document.getElementById("online").textContent = r.online ?? "-";
  document.getElementById("max").textContent = r.max ?? "-";
  const s = document.getElementById("status");
  s.textContent = r.ok ? "正常" : "离线";
  s.className = r.ok ? "ok" : "down";
}

// ========== 追加单点（SSE） ==========
function pushPoint(rec) {
  const last = lastRaw[lastRaw.length - 1];
  if (last && last.ts === rec.ts) return;
  if (last && rec.ts < last.ts) return;
  lastRaw.push(rec);
  const cutoff = Math.floor(Date.now() / 1000) - currentHours * 3600;
  lastRaw = lastRaw.filter(d => d.ts >= cutoff);
  lastChangePts = extractChangePoints(lastRaw);
  lastMax = lastRaw.map(d => [d.ts * 1000, d.max]);
  updateHeader(rec);
  renderChart(lastRaw, lastChangePts, lastMax);
}

// ========== 全量拉取 ==========
async function loadFullData() {
  try {
    const data = await fetch(
      `${API}/api/records?hours=${currentHours}&t=${Date.now()}`,
      { cache: "no-store" }
    ).then(r => r.json());

    document.getElementById("host").textContent = data.host;

    if (data.interval && data.interval !== refreshInterval) {
      refreshInterval = data.interval;
      restartTimer();
      console.log(`[refresh] 同步后端间隔：${refreshInterval}s`);
    }

    lastRaw = data.data;
    lastChangePts = extractChangePoints(lastRaw);
    lastMax = lastRaw.map(d => [d.ts * 1000, d.max]);
    if (lastRaw.length) updateHeader(lastRaw[lastRaw.length - 1]);
    renderChart(lastRaw, lastChangePts, lastMax);
  } catch (e) {
    console.warn("records fetch failed, keep old chart", e);
  }
}

function restartTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadFullData, refreshInterval * 1000);
  console.log(`[refresh] 全量刷新间隔 = ${refreshInterval}s`);
}

// ========== SSE ==========
let es = null;
function connectSSE() {
  if (es) es.close();
  es = new EventSource(`${API}/api/stream`);
  es.onmessage = e => {
    try {
      const rec = JSON.parse(e.data);
      pushPoint(rec);
    } catch (err) {
      console.warn("bad SSE payload", err);
    }
  };
  es.onerror = () => {
    console.warn("SSE 断开，5s 后重连");
    es.close();
    setTimeout(connectSSE, 5000);
  };
}

// ========== 时间范围切换 ==========
document.getElementById("seg").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#seg button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentHours = Number(btn.dataset.h);
  zoomState = { start: 0, end: 100 };
  loadFullData();
});

// ========== resize ==========
let resizeTimer = null;
window.addEventListener("resize", () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    chart.resize();
    renderChart(lastRaw, lastChangePts, lastMax);
  }, 120);
});

// ========== 初始化 ==========
applyTheme();

loadFullData().then(() => {
  restartTimer();
  connectSSE();
  chart.resize();
});
</script>
</body>
</html>
